[package]
name = "ck-web"
version = "0.4.0"
edition = "2024"
description = "ck's browser helper: Chromium (CEF), with no window, for posting from the terminal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gold-silver-copper/ck"
# CEF's files sit next to the binary; it's built from the repository, not installed.
publish = false

[dependencies]
base64 = "0.22"
dirs = "7.0.0"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Chromium's sandbox on Windows needs CEF's bootstrap.exe to start ck-web as a library: without
# the sandbox, ck-web is a program of its own there.
[target.'cfg(not(windows))'.dependencies]
cef = "=154.5.0"
[target.'cfg(windows)'.dependencies]
cef = { version = "=154.5.0", default-features = false }
# The one cef already uses.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

# The NSApplication Chromium wants on macOS (cef's own objc2).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSEvent"] }

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
indexing_slicing = "deny"
