[package]
name = "ck-web"
version = "0.1.0"
edition = "2024"
description = "ck's browser helper: Chromium (CEF), with no window, for posting to 4chan from the terminal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gold-silver-copper/ck"
# CEF's files sit next to the binary; it's built from the repository, not installed.
publish = false

[dependencies]
base64 = "0.22"
cef = "=154.5.0"
dirs = "7.0.0"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
indexing_slicing = "deny"
