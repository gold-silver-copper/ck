[package]
name = "ck"
version = "0.2.0"
edition = "2024"
description = "A read-only terminal imageboard browser for 4chan, vichan, LynxChan, jschan and FoolFuuka archives"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gold-silver-copper/ck"
readme = "README.md"
keywords = ["imageboard", "tui", "terminal", "4chan", "ratatui"]
categories = ["command-line-utilities"]
# Test data (real scraped posts) and UI snapshots stay in the repository only.
exclude = ["tests/fixtures", "src/snapshots"]

[dependencies]
anyhow = "1.0.104"
# The version crossterm uses.
base64 = "0.22"
chrono = "0.4.45"
dirs = "7.0.0"
html-escape = "0.2.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
open = "5.4.4"
ratatui = "0.30"
# The version ratatui uses; for OSC 52 clipboard writes.
crossterm = { version = "0.29", features = ["osc52"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
toml_edit = "0.25.15"
unicode-width = "0.2.2"
ureq = "3"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unreachable = "forbid"
todo = "forbid"
unimplemented = "forbid"
string_slice = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

# Long fuzz runs: release speed, with overflow and debug checks on.
[profile.fuzz]
inherits = "release"
lto = false
codegen-units = 16
overflow-checks = true
debug-assertions = true
