[package]
name = "ck"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
html-escape = "0.2.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
open = "5.4.4"
ratatui = "0.30"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
toml_edit = "0.25.15"
unicode-width = "0.2.2"
ureq = "3"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"
