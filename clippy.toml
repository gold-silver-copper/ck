# Tests may unwrap and panic; the code they test may not (see [lints] in Cargo.toml).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
disallowed-methods = [
  { path = "unicode_width::UnicodeWidthStr::width", reason = "measures differently from what ratatui draws; use markup::columns or markup::spans_columns" },
  { path = "unicode_width::UnicodeWidthStr::width_cjk", reason = "measures differently from what ratatui draws; use markup::columns or markup::spans_columns" },
  { path = "unicode_width::UnicodeWidthChar::width", reason = "measures differently from what ratatui draws; use markup::columns or markup::spans_columns" },
  { path = "unicode_width::UnicodeWidthChar::width_cjk", reason = "measures differently from what ratatui draws; use markup::columns or markup::spans_columns" },
  { path = "ratatui::text::Span::width", reason = "measures differently from what ratatui draws; use markup::columns or markup::spans_columns" },
  { path = "ratatui::text::Line::width", reason = "measures differently from what ratatui draws; use markup::columns or markup::spans_columns" },
  { path = "ratatui::text::Text::width", reason = "measures differently from what ratatui draws; use markup::columns or markup::spans_columns" },
  { path = "ratatui::buffer::CellWidth::cell_width", reason = "measures a whole string at once, not as ratatui draws it; use markup::columns" },
]
