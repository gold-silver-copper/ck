name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build without warnings
        run: cargo build
        env:
          RUSTFLAGS: -D warnings
      - name: Tests (offline; unit, parsing, snapshots, short fuzz runs)
        run: cargo test

  # The browser helper (Chromium through CEF, downloaded by its build): its own job, so ck's
  # stays quick. Linux only for now.
  ck-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Clippy
        run: cargo clippy -p ck-web -- -D warnings

