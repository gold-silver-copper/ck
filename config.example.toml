# Remap commands: action = "key", or several: action = ["key", "key"]. Keys are a
# character ("w", "W", ":"), ctrl-/alt- with one ("ctrl-w", "alt-x"), or a named key (tab,
# shift-tab, enter, esc, backspace, delete, insert, up, down, left, right, home, end,
# pageup, pagedown, space, f1-f12). Settings (`,`) has a key editor that saves here.
# Navigation keys are fixed: j/k/h/l, g/G, J/K, z, digits (counts), arrows, enter, esc,
# space, ctrl-d/u/e/y/f/b.
# Actions and their defaults:
#   everywhere: quit = "q", help = "?", search = "/", reload = "r", browser = "o", settings = ",",
#               goto = ":", next_tab = "]", prev_tab = "[", close_tab = "ctrl-w", menu = ".",
#               jump_back = "u", jump_forward = "ctrl-r"
#   everywhere but the image viewer and gallery: watched = "W"
#   everywhere but the image viewer: hints = "f"
#   catalog:    view = "v", watch = "w", sort = "s", compact = "c", links = "O", hide = "H",
#               show_hidden = "Z", filter = "X", archive_search = "A"
#   thread:     next_part = "tab", prev_part = "shift-tab",
#               view, watch, links, hide, show_hidden, filter, mine = "m", expand = "e", gallery = "V",
#               conversation = "c", poster = "I", media = "M",
#               image_search = "R", open_file = "i",
#               replies = "b", unread = "U",
#               preview = "p", next_match = "n", prev_match = "N", spoiler = "s",
#               all_spoilers = "S", download = "d", archive = "a",
#               download_post, download_thread, export: no key (in the . menu)
#   catalog, thread, Watched/History: new_tab = "T", follow = "F"
#   home screen, Boards: favorite = "*"; remove = "x" takes a favorite off
#   Watched/History/Saved: remove = "x"
#   catalog, thread, Watched/History/Saved, image viewer: copy = "y", copy_link = "Y"
[keys]
# watch = "Q"
# help = ["?", "f1"]

# Hidden words: any post or thread with one of these words is hidden, everywhere. Plain
# words in any case, whole words ("cat" isn't "concatenate"); also in Settings and from a
# post's X (w).
# hidden_words = ["crypto", "free money"]

# In a thread, replies to a hidden post (posts that quote it), and the replies to those, are
# hidden too. A filter can do it for what it hides alone: `recursive = true`. Also in
# Settings.
# recursive_hiding = true

# Filters hide (or highlight) threads and posts whose text matches a regex. `field` is
# "subject", "comment", "name" (with the tripcode), "filename", "md5" (a file's base64
# MD5, compared exactly), "id" (the poster ID), "flag" (its code or name), "tripcode",
# "capcode" (4chan's roles spelled its way on every site: "mod", "admin", ...; others as
# sent), "dimensions" (a file's "1920x1080"), "filesize" (a range, not a regex:
# ">2MB", "<=100KB", "1MB-5MB"; B, KB, MB, GB of 1024) or "postno" (the number's
# digits), or a list; the default is subject and comment. Optional `sites` and `boards`
# limit where a filter applies; `op = true` or `reply = true` to OPs (threads) or replies;
# `label` is what's shown on what it catches; `enabled = false` keeps a filter here
# without applying it; `recursive = true` hides the replies to what it hides in a thread
# too (and theirs); `notify = true` sends a notification when a watched thread's refresh
# (or a followed general's board) brings a post (or thread) it catches; `top = true` puts
# what it highlights first in catalogs. X on a post (or thread) adds one like it, and
# Settings › Filters lists, edits and removes them (comments here are kept).
#
# [[filter]]
# pattern = "(?i)crypto|nft"
# label = "crypto"
# recursive = true
#
# [[filter]]
# pattern = "(?i)rust"
# action = "highlight"
# boards = ["g"]
# top = true
# enabled = false
#
# [[filter]]
# pattern = ">4MB"
# field = "filesize"
# op = true

# Reverse image search engines for R ({url} becomes the image's address). Without any,
# ck offers SauceNAO, Google Lens, Yandex and IQDB.
#
# [[image_search]]
# name = "SauceNAO"
# url = "https://saucenao.com/search.php?url={url}"

# Custom themes. Start from a built-in (`base`) or generate one from a single color
# (`seed`, with mode = "dark" or "light"), then override any role. Colors are "#rrggbb",
# names ("light-blue"), 256-color indexes ("244"), or "default" (the terminal's own).
#
# [themes.mine]
# base = "nord"
# primary = "#ebcb8b"
#
# [themes.ocean]
# seed = "#2a9d8f"
# mode = "dark"
#
# Roles:
#   background        base of the screen, and the gaps between cards
#   surface           cards: catalog entries and posts
#   surface_high      chips and tiles on cards
#   surface_highest   raised panels: help, quote preview, settings pickers
#   bar, on_bar       the top and bottom bars, and their text
#   text, text_dim    body text; times, numbers, hints
#   primary, on_primary                        accent, and text on it
#   primary_container, on_primary_container    OP and title chips, and their text
#   selection         background of the selected row, card or post
#   greentext, pinktext, quotelink, heading, code, code_bg, name
#   new, error, success, warning
#   search, on_search background and text of search matches
#   spoiler           hidden spoilers
