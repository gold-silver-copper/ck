[[site]]
name = "endchan"
kind = "lynxchan"
url = "https://endchan.net"

[[site]]
name = "kohlchan"
kind = "lynxchan"
url = "https://kohlchan.net"

[[site]]
name = "desuarchive"
kind = "foolfuuka"
url = "https://desuarchive.org"

[[site]]
name = "zzzchan"
kind = "jschan"
url = "https://zzzchan.xyz"

# Remap single-key commands: action = "key". Navigation keys (j/k/g/G/h/l/J/K, arrows,
# enter, esc, space) are fixed. Actions and their defaults:
#   everywhere: quit = "q", help = "?", search = "/", reload = "r", browser = "o"
#   catalog:    view = "v", watch = "w", sort = "s", compact = "c"
#   thread:     view, watch, open_file = "i", replies = "b", jump_back = "u", unread = "U",
#               preview = "p", next_match = "n", prev_match = "N", spoiler = "s",
#               all_spoilers = "S", download = "d", download_thread = "D", archive = "a"
#   Watched/History: remove = "x"
[keys]
# watch = "W"

# Colors: names ("yellow", "light-red"), "#rrggbb", or 256-color indexes ("244").
[theme]
# accent = "yellow"         # titles, subjects, the selection gutter
# dim = "dark-gray"         # times, hints, placeholders
# selected = "#2d2d3c"      # background of the selected row
# search = "yellow"         # background of search matches
# name = "green"            # poster names
# greentext = "green"
# quotelink = "magenta"
# heading = "red"
# code = "cyan"
# new = "green"             # "● new" markers and unread counts
