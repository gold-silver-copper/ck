# ck configuration. Copy to ~/.config/ck/config.toml and edit.
#
# The built-in sites are always there (`ck --print-sites` prints them). To add another,
# paste a link to it after `:` or in Settings › Sites, and ck works out the rest; or add a
# [[site]] table here. A [[site]] with a built-in site's name replaces it, and
# `default_sites = false` leaves out every built-in one.
#
# Each [[site]] needs a `name` and a `kind`:
#   kind = "4chan"     the official 4chan API (no url needed)
#   kind = "vichan"    vichan / tinyboard / infinity engines (lainchan, wizchan, ...).
#                      These have no board-list API, so `boards` is required.
#   kind = "lynxchan"  LynxChan engines (endchan, kohlchan, ...). Boards are
#                      fetched automatically unless `boards` is given.
#   kind = "foolfuuka" FoolFuuka 4chan archives (desuarchive, b4k, ...).
#   kind = "jschan"    jschan engines (zzzchan, ...).
#   kind = "makaba"    2ch.hk.
#   kind = "kissu"     kissu.moe, read as vichan, posting its own way.
#
# `media_url` is where a site's files are served from when that's another host (8kun, 2ch).
#
# vichan sites may set `post_url` when posts go to another host (8kun's sys.8kun.top).
#
# `archive` names another site (a FoolFuuka archive) to offer when a thread 404s.
#
# `boards` entries are either a bare URI ("g") or { uri = "g", title = "Technology" }.
#
# vichan sites may set `thumb_ext` when the site renders every thumbnail in one format
# (vichan's own `thumb_ext` setting). Leave it out if thumbnails keep the file's extension.

# Thumbnails in the catalog and thread views, and the `v` image viewer.
#   "auto"  detect the terminal's image protocol (kitty, sixel, iTerm2), else half-blocks
#           (inside zellij, which says sixel whatever the terminal is: half-blocks)
#   "halfblocks", "sixel", "kitty", "iterm2"   that protocol, whatever the terminal says
#   "off"   no images, no image requests
images = "auto"

# Images on boards the site marks NSFW: "show", or "off" (no thumbnails, nothing asked for).
# A board's own setting (". menu › images on this board") comes first. vichan sites don't
# mark boards, so theirs count as worksafe.
nsfw_images = "show"

# Colors. Press `,` in ck to pick a theme (with a live preview) or change any color; the
# settings screen saves to this file. Built-in themes: material, material-light, nord,
# gruvbox, catppuccin, tokyo-night, solarized-light, terminal (keeps the terminal's own
# background and 16 colors) and mono (no colors at all). Without a theme here it's
# material, or mono when the NO_COLOR environment variable is set. Custom themes are
# [themes.NAME] tables, see the end.
# theme = "material"

# New posts in watched threads, and replies to posts you marked as yours (m): "auto" (a
# desktop notification in terminals known to show them, else the bell), "bell", or "off".
notify = "auto"
# Or run a command (no shell; {title} and {body} are filled in):
# notify_command = ["notify-send", "{title}", "{body}"]

# Where ck-web, the browser helper ck posts through, is, if you built your own (by
# default: the one ck downloads, then next to ck, then on the PATH).
# web_helper = "~/ck/target/release/ck-web"

# The password posts are sent with, for deleting them on sites that let you (by default a
# new one each run).
# post_password = "something only you know"

# Some sites ask a proof of work before a post (alogs', kohlchan's): how long ck searches for
# it, in seconds, and on how many threads (by default half the machine's, four at most).
# proof_of_work_seconds = 180
# proof_of_work_threads = 4

# The terminal's title says where you are and what's new: "ck: (3) /g/ Thread subject",
# with "(You)" when a new post replies to yours. The old title is put back on exit. Also in
# Settings.
set_title = true

# 24-bit color: "auto" (when the terminal sets COLORTERM=truecolor), "truecolor", or "256".
color = "auto"

# Background refresh intervals in seconds: the open thread, and each watched thread.
# Lower values are raised to the minimums (10 and 60).
refresh_thread_secs = 10
refresh_watched_secs = 60
# A thread that's quiet is refreshed less often: each refresh that brings no new post makes
# the next wait half as long again, up to 10 times the interval (10 minutes at most, unless
# the interval is longer). New posts (or r) start over. false keeps the intervals as they
# are. Also in Settings.
refresh_backoff = true

# Watched threads are saved as they refresh, and kept when they die; saving a thread as a
# page (the . menu) saves one too. They open from the Saved row on the home screen, offline. Past this many megabytes,
# the oldest copies of threads you don't watch are removed (0 keeps everything).
saved_max_mb = 500

# The last copy of each catalog and thread you open is kept in the cache directory, so
# opening one again shows it at once (marked "cached") while it's refreshed, and the first
# request after a restart can be answered "not modified". At most this many megabytes, the
# oldest out first; 0 keeps none.
page_cache_mb = 100

# While you read down a thread, the selected post is kept this far from the top and bottom
# of the screen (a fraction of it): 0.3 keeps it about a third of the way down, 0.5 centered,
# 0 lets it reach the edge. Also in Settings.
scroll_margin = 0.3

# Reading the last post of a thread, posts a refresh brings come into view: the first new one
# is selected, as `j` would. Elsewhere in the thread nothing moves, and the top bar says how
# many new posts are below. Also in Settings.
follow_new_posts = true

# Favorite boards, shown at the top of the home screen (1-9 open them). * on a board adds
# or removes one, and saves the list here.
favorites = []
# Sites left off the home screen (x on a site there hides it and saves the list here).
hidden_sites = []

# Start where you left off: the same view, thread and selected post as when ck quit.
restore_session = true

# Catalog layout: "cards" (a card per thread with a thumbnail), "compact" (a line per
# thread) or "grid" (thumbnails in columns). This is the default; `c` in a catalog sets
# that board's own (and `s` its sort), kept in the data directory.
catalog_layout = "cards"

# Threads you watch (marked ◉) come first in catalogs, then the rest in the sort's order;
# threads a `top = true` filter highlights still come before them. Also in Settings.
watched_first = false

# Lines of each thread's text in catalog cards; the card and its thumbnail grow with them
# (unset: as many as fit beside the thumbnail). Also in Settings › Preview lines.
# catalog_lines = 5

# Where saved files and pages go. {site}, {board} and {thread} are filled in, and {downloads}
# is your Downloads folder. "~/" works too.
# download_dir = "{downloads}/ck/{site}/{board}/{thread}"

